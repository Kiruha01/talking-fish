<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="/save">
        <div>
            <h2>WiFi</h2>
            <div>
                <label for="hp">HP</label>
                <input type="text" id="hp" name="hp">
            </div>
            <div>
                <label for="psk">PSK</label>
                <input type="text" id="psk" name="psk">
            </div>
        </div>
        <div>
            <h2>Spec</h2>
            <div>
                <label for="url">URL</label>
                <input type="text" id="url" name="url">
            </div>
        </div>
        <div>
            <h2>MQTT</h2>
            <div>
                <label for="mqtt_server">Server</label>
                <input type="text" id="mqtt_server" name="mqtt_server">
            </div>
            <div>
                <label for="mqtt_username">Username</label>
                <input type="text" id="mqtt_username" name="mqtt_username">
            </div>
            <div>
                <label for="mqtt_password">Password</label>
                <input type="text" id="mqtt_password" name="mqtt_password">
            </div>
        </div>
        <button type="submit">Save</button>
    </form>
</body>
</html>
